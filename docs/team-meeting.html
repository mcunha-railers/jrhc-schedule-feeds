<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Meeting</title>

<style>
#gate {
position: fixed;
inset: 0;
z-index: 999;
display: flex;
align-items: center;
justify-content: center;
background: var(--rink-navy, #0f2c52);
padding: 1.5rem;
}
#gate .box {
width: 100%;
max-width: 22rem;
background: var(--surface, #fff);
border-radius: 12px;
padding: 2rem 1.75rem;
text-align: center;
box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}
#gate h2 {
margin: 0 0 0.4rem;
font-family: "Teko", "Arial Narrow", sans-serif;
font-size: 1.8rem;
color: var(--ink, #0f2c52);
}
#gate p {
margin: 0 0 1.1rem;
font-size: 0.85rem;
color: var(--steel, #52627a);
font-family: "Public Sans", sans-serif;
}
#gate input {
width: 100%;
padding: 0.6rem 0.8rem;
border: 1px solid var(--line, #d3dde6);
border-radius: 7px;
font-size: 0.95rem;
margin-bottom: 0.7rem;
box-sizing: border-box;
font-family: "Public Sans", sans-serif;
}
#gate button {
width: 100%;
padding: 0.6rem 0.8rem;
border: none;
border-radius: 7px;
background: var(--faceoff-red, #2360b5);
color: #fff;
font-size: 0.9rem;
font-weight: 600;
cursor: pointer;
font-family: "Public Sans", sans-serif;
}
#gate .err {
color: #c2453d;
font-size: 0.8rem;
margin-top: 0.6rem;
min-height: 1em;
font-family: "Public Sans", sans-serif;
}
</style>
<style>
:root {
--ice: #eef1f5;
--surface: #ffffff;
--ink: #0f2c52;
--steel: #52627a;
--steel-soft: #8b98a6;
--line: #d3dde6;
--rink-navy: #0f2c52;
--rink-navy-deep: #081729;
--faceoff-red: #2360b5;
--faceoff-red-ink: #184a91;
--crease-blue: #2360b5;
--frost: #e4edf8;
--focus-ring: #2360b5;
}

@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
--ice: #081729;
--surface: #0f2c52;
--ink: #eef3f8;
--steel: #adb2b6;
--steel-soft: #7c93ab;
--line: #2a4a72;
--rink-navy: #0f2c52;
--rink-navy-deep: #050f1c;
--faceoff-red: #5b9bdc;
--faceoff-red-ink: #8fc1e8;
--crease-blue: #5b9bdc;
--frost: #163a66;
--focus-ring: #5b9bdc;
}
}

:root[data-theme="dark"] {
--ice: #081729;
--surface: #0f2c52;
--ink: #eef3f8;
--steel: #adb2b6;
--steel-soft: #7c93ab;
--line: #2a4a72;
--rink-navy: #0f2c52;
--rink-navy-deep: #050f1c;
--faceoff-red: #5b9bdc;
--faceoff-red-ink: #8fc1e8;
--crease-blue: #5b9bdc;
--frost: #163a66;
--focus-ring: #5b9bdc;
}

* { box-sizing: border-box; }

html, body {
margin: 0;
height: 100%;
overflow: hidden;
}

body {
background: var(--ice);
color: var(--ink);
font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
line-height: 1.5;
-webkit-font-smoothing: antialiased;
}

a { color: var(--crease-blue); }

a:focus-visible, button:focus-visible {
outline: 2px solid var(--focus-ring);
outline-offset: 2px;
border-radius: 3px;
}

.mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }

#deck-root { height: 100%; }

#slides {
position: relative;
height: 100%;
}

.slide {
position: absolute;
inset: 0;
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 5rem 4rem 4.5rem;
text-align: left;
overflow-y: auto;
overflow-x: hidden;
}
.slide.active { display: flex; }

.slide--title, .slide--divider {
background: linear-gradient(160deg, var(--rink-navy) 0%, var(--rink-navy-deep) 100%);
color: #eef4f9;
text-align: center;
}

.slide--content, .slide--diagram {
background: var(--ice);
color: var(--ink);
align-items: flex-start;
}

.eyebrow {
font-family: "IBM Plex Mono", monospace;
font-size: clamp(0.8rem, 1.1vw, 1rem);
letter-spacing: 0.16em;
text-transform: uppercase;
color: #9fb7cc;
margin: 0 0 1rem;
}
.slide--content .eyebrow, .slide--diagram .eyebrow {
color: var(--faceoff-red-ink);
}

.slide--title h1, .slide--divider h1 {
margin: 0;
font-family: "Teko", sans-serif;
font-weight: 600;
font-size: clamp(3rem, 9vw, 6.4rem);
line-height: 0.95;
color: #fff;
}
.slide--title .sub {
max-width: 42rem;
color: #c3d5e3;
font-size: clamp(1rem, 1.6vw, 1.35rem);
margin: 1.3rem 0 0;
}
.slide--divider .group-num {
font-family: "Teko", sans-serif;
font-size: clamp(1.4rem, 3vw, 2rem);
color: var(--faceoff-red);
margin: 1.4rem 0 0;
}

.slide-head {
width: 100%;
max-width: 58rem;
margin: 0 0 1.6rem;
}
.slide-head h2 {
margin: 0;
font-family: "Teko", sans-serif;
font-weight: 600;
font-size: clamp(2.1rem, 4.2vw, 3.2rem);
line-height: 1;
color: var(--ink);
}

.slide-body {
width: 100%;
max-width: 58rem;
overflow-y: auto;
max-height: calc(100vh - 15rem);
}

.slide-body p.lead {
font-size: clamp(1.05rem, 1.6vw, 1.4rem);
color: var(--ink);
margin: 0 0 1rem;
}
.slide-body .subhead {
font-family: "IBM Plex Mono", monospace;
font-size: clamp(0.72rem, 1vw, 0.85rem);
letter-spacing: 0.05em;
text-transform: uppercase;
color: var(--faceoff-red-ink);
margin: 1.4rem 0 0.6rem;
}
.slide-body .subhead:first-child { margin-top: 0; }
.slide-body .subnote {
font-size: clamp(0.85rem, 1.2vw, 1rem);
color: var(--steel);
margin: -0.3rem 0 0.6rem;
}

.slide-body ul, .slide-body ol {
margin: 0 0 1rem;
padding-left: 1.5rem;
}
.slide-body li {
font-size: clamp(1rem, 1.5vw, 1.3rem);
line-height: 1.45;
margin-bottom: 0.65rem;
}
.slide-body strong { color: var(--ink); }
.slide-body ul.two-col {
columns: 2;
column-gap: 2.5rem;
}
.slide-body ul.two-col li { break-inside: avoid; }

.slide-body .note {
background: var(--frost);
border-radius: 10px;
padding: 0.9rem 1.15rem;
font-size: clamp(0.9rem, 1.3vw, 1.05rem);
color: var(--ink);
margin: 0.5rem 0 1rem;
}

.tag {
display: inline-block;
font-family: "IBM Plex Mono", monospace;
font-size: 0.62rem;
letter-spacing: 0.05em;
text-transform: uppercase;
padding: 0.15rem 0.6rem;
border-radius: 999px;
margin-left: 0.6rem;
vertical-align: middle;
background: var(--frost);
color: var(--faceoff-red-ink);
border: 1px solid var(--crease-blue);
white-space: nowrap;
}

.diagram-embed {
position: relative;
width: 100%;
max-width: 40rem;
border: 1px solid var(--line);
border-radius: 14px;
overflow: hidden;
background: var(--surface);
box-shadow: 0 8px 30px rgba(15,44,82,0.12);
}
.diagram-embed iframe {
width: 100%;
height: min(80vh, 750px);
border: 0;
display: block;
}
.slide--diagram .slide-body { margin-bottom: 0.6rem; }

.expand-btn {
position: absolute;
top: 0.7rem;
right: 0.7rem;
z-index: 5;
width: 2.3rem;
height: 2.3rem;
border-radius: 8px;
border: 1px solid var(--line);
background: color-mix(in srgb, var(--surface) 90%, transparent);
color: var(--steel);
font-size: 1.1rem;
cursor: pointer;
backdrop-filter: blur(4px);
display: flex;
align-items: center;
justify-content: center;
}
.expand-btn:hover { border-color: var(--crease-blue); color: var(--crease-blue); }

.diagram-overlay {
position: fixed;
inset: 0;
z-index: 50;
background: color-mix(in srgb, var(--rink-navy-deep) 92%, transparent);
display: flex;
align-items: center;
justify-content: center;
padding: 3vh 3vw;
}
.diagram-overlay[hidden] { display: none; }
.diagram-overlay .overlay-card {
width: 100%;
height: 100%;
max-width: 96vw;
max-height: 94vh;
background: var(--surface);
border-radius: 14px;
overflow: hidden;
box-shadow: 0 30px 90px rgba(0,0,0,0.5);
position: relative;
}
.diagram-overlay iframe {
width: 100%;
height: 100%;
border: 0;
display: block;
}
.overlay-close {
position: absolute;
top: 0.9rem;
right: 0.9rem;
z-index: 5;
width: 2.5rem;
height: 2.5rem;
border-radius: 50%;
border: 1px solid var(--line);
background: var(--surface);
color: var(--ink);
font-size: 1.2rem;
cursor: pointer;
box-shadow: 0 4px 14px rgba(15,44,82,0.2);
}
.overlay-close:hover { border-color: var(--crease-blue); color: var(--crease-blue); }

.img-link {
color: inherit;
text-decoration: underline;
text-decoration-style: dotted;
text-underline-offset: 3px;
cursor: pointer;
background: none;
border: none;
font: inherit;
padding: 0;
}
.img-link:hover { color: var(--crease-blue); }
.diagram-overlay img {
width: 100%;
height: 100%;
object-fit: contain;
background: var(--rink-navy-deep);
display: block;
}

.logo-watermark {
position: absolute;
right: -70px;
bottom: -70px;
width: 400px;
height: 400px;
opacity: 0.14;
pointer-events: none;
user-select: none;
}
@media (max-width: 900px) {
.logo-watermark { width: 220px; height: 220px; right: -40px; bottom: -40px; }
}

/* ---- Chrome: top bar, progress, nav, menu ---- */
.topbar-fixed {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 30;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0.75rem 1.1rem;
font-family: "IBM Plex Mono", monospace;
font-size: 0.78rem;
color: var(--steel);
pointer-events: none;
}
.topbar-fixed > * { pointer-events: auto; }
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 0.6rem; }
.slide--title ~ .topbar-fixed, .slide--divider ~ .topbar-fixed {}
.icon-btn {
background: color-mix(in srgb, var(--surface) 85%, transparent);
border: 1px solid var(--line);
color: var(--steel);
border-radius: 8px;
width: 2.1rem;
height: 2.1rem;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
font-size: 1rem;
backdrop-filter: blur(6px);
}
.icon-btn:hover { border-color: var(--crease-blue); color: var(--crease-blue); }
.counter {
background: color-mix(in srgb, var(--surface) 85%, transparent);
border: 1px solid var(--line);
border-radius: 999px;
padding: 0.35rem 0.9rem;
backdrop-filter: blur(6px);
}
.handbook-link {
background: color-mix(in srgb, var(--surface) 85%, transparent);
border: 1px solid var(--line);
border-radius: 999px;
padding: 0.35rem 0.9rem;
text-decoration: none;
color: var(--steel);
backdrop-filter: blur(6px);
}
.handbook-link:hover { border-color: var(--crease-blue); color: var(--crease-blue); }

.progress-fixed {
position: fixed;
bottom: 0; left: 0; right: 0;
height: 3px;
background: var(--line);
z-index: 30;
}
.progress-fill {
height: 100%;
background: var(--faceoff-red);
width: 0%;
transition: width 0.25s ease;
}

.nav-fixed {
position: fixed;
bottom: 1.3rem;
right: 1.3rem;
z-index: 30;
display: flex;
gap: 0.5rem;
}
.nav-fixed button {
width: 2.6rem;
height: 2.6rem;
border-radius: 50%;
border: 1px solid var(--line);
background: var(--surface);
color: var(--ink);
font-size: 1.2rem;
cursor: pointer;
box-shadow: 0 4px 14px rgba(15,44,82,0.15);
}
.nav-fixed button:hover { border-color: var(--crease-blue); color: var(--crease-blue); }
.nav-fixed button:disabled { opacity: 0.35; cursor: default; }

.menu-overlay {
position: fixed;
inset: 0;
z-index: 40;
background: color-mix(in srgb, var(--rink-navy) 88%, transparent);
backdrop-filter: blur(4px);
display: flex;
align-items: center;
justify-content: center;
padding: 2rem;
}
.menu-overlay[hidden] { display: none; }
.menu-box {
width: 100%;
max-width: 40rem;
max-height: 85vh;
overflow-y: auto;
background: var(--surface);
border-radius: 14px;
padding: 1.6rem 1.8rem;
box-shadow: 0 24px 70px rgba(0,0,0,0.4);
}
.menu-box h3 {
margin: 0 0 1rem;
font-family: "Teko", sans-serif;
font-weight: 600;
font-size: 1.5rem;
color: var(--ink);
}
.menu-section {
font-family: "IBM Plex Mono", monospace;
font-size: 0.68rem;
letter-spacing: 0.08em;
text-transform: uppercase;
color: var(--steel);
margin: 1.1rem 0 0.4rem;
}
.menu-section:first-of-type { margin-top: 0; }
.menu-item {
display: block;
width: 100%;
text-align: left;
background: none;
border: none;
border-radius: 7px;
padding: 0.5rem 0.6rem;
font-size: 0.95rem;
color: var(--ink);
cursor: pointer;
font-family: "Public Sans", sans-serif;
}
.menu-item:hover { background: var(--frost); color: var(--crease-blue); }
.menu-item.current { color: var(--faceoff-red-ink); font-weight: 600; }
.menu-hint {
font-size: 0.78rem;
color: var(--steel);
margin: 1.2rem 0 0;
padding-top: 0.9rem;
border-top: 1px solid var(--line);
}

@media (max-width: 720px) {
.slide { padding: 4.5rem 1.4rem 3.5rem; }
.slide-body { max-height: calc(100vh - 12rem); }
.topbar-fixed { flex-wrap: wrap; }
}
</style>

var SLIDES = [
{ type: "title", eyebrow: "Junior Railers Hockey Club &middot; 15U Select &middot; 2026-27 Season", title: "Team Meeting", sub: "Team rules, logistics, and on-ice systems." },

{ type: "divider", section: "Part 1", title: "Team Rules &amp; Expectations" },

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Communication", body: [
  { ul: [
    "All communication about hockey goes <strong>directly between coaches and players</strong> — not through parents. If a player has a question, an issue, needs to report they'll miss something, or needs anything else, the player reaches out to a coach themselves.",
    "Parents should not be contacting coaches on a player's behalf. Questions about the player's own hockey (ice time, why a decision was made, etc.) should come from the player, not the parent."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Staying Informed (Crossbar)", body: [
  { ul: [
    "Check Crossbar regularly. Schedule changes, game/jersey info, and team communications get posted there — it's each player's job to stay on top of it, not something a coach will separately remind you about.",
    "Practice plans are typically posted by <strong>2:00 PM on practice days</strong>. Review the plan before you get to the rink — have a general idea of what we're working on and come prepared, both mentally and physically."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Attendance", body: [
  { ul: [
    "<strong>We expect players to be at practice.</strong> Missing practice can impact playing time in games.",
    "We understand practices will be missed sometimes — fall school sports, family commitments, and other real conflicts happen, and that's understood. But we expect you to prioritize this team. Every player is an important piece of our development and success.",
    "There's a difference between a legitimate need (a big test you have to study for) and poor time management (you knew about it and put it off until the last minute, and now need the time because of that). The first is understood. The second isn't — be better about that.",
    "Players are responsible for updating their own attendance in Crossbar — not a parent's job."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Equipment &amp; Uniforms", body: [
  { ul: [
    "Full equipment at every practice and game — this includes neck guards. No exceptions.",
    "Correct jerseys and correct socks for practices and games — know what we're wearing before you show up.",
    "Bring <strong>both uniforms (home and away) to every game.</strong> Captains and players are responsible for figuring out which jersey the team is wearing that day — communicate with the other team's coaches to confirm before warmups. Come prepared to each game — no one, including coaches, should be searching for spare jerseys on game day."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Playing Time, Lineups &amp; Goalies", body: [
  { ul: [
    "<strong>Playing time is not even — it's earned.</strong> Coaches play the players who give the team the best chance to win. That's based on commitment, how a player is performing, attitude, and everything else that goes into being a good teammate — not a rotation or a guarantee.",
    "<strong>Alternates:</strong> we carry 3 alternates — Lucey, Reissner, Nordman. They're called on to play when the full-time roster (3 lines, 6 D, and 2 G) isn't fully available for a game.",
    "<strong>Goalies:</strong> we want our goalies playing full games. We'll alternate goalies throughout the season and announce who's playing the upcoming weekend at Thursday's practice.",
    "If we feel a mid-game goalie change could have a positive impact on the game or the team, that can happen. We'll try to prepare goalies for what to expect, but part of being a goalie — especially if you didn't start — is being ready to help your team the moment you're called on."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Respect &amp; Conduct", body: [
  { ul: [
    "You represent yourself, your team, the Junior Railers, and your family — at all times, everywhere: on the ice, on the bench, in the locker room, at school, and at home. Make the right choices.",
    "Be respectful to teammates, coaches, officials, opponents, and rink staff.",
    "Support each other — on the bench, in the room, and outside the rink."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Locker Room Policy", body: [
  { p: "There's no other sport where you spend as much time together, or have anything quite like the atmosphere of the locker room. It can be dangerous too: skate blades are sharp, and it doesn't take much for horsing around to turn into a real injury. Be respectful of each other and the space, and enjoy it for what it is." },
  { ul: [
    "No cell phones or other recording-capable devices used in the locker room.",
    "Only players, coaches, and approved team personnel in the locker room — no outside visitors.",
    "<button type=\"button\" class=\"img-link\" data-img=\"assets/locker-room-clean.jpg\">Locker rooms must be left clean</button> — every time, every rink."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Unacceptable Behavior", body: [
  { p: "Not acceptable from anyone on this team, at any team activity (practice, game, tournament, locker room, or team travel):" },
  { ul: [
    "Disrespect toward officials, coaches, teammates, or opponents — arguing calls, taunting, verbal abuse.",
    "Fighting, or any attempt to injure another player, outside what happens within the normal course of play.",
    "<strong>Bullying, hazing, or excluding a teammate.</strong>",
    "Discriminatory language or behavior of any kind.",
    "<strong>Phones or recording devices used in the locker room.</strong>",
    "Unsportsmanlike conduct that reflects poorly on the team.",
    "Ignoring coaching instructions or team rules.",
    "Showing up late or unprepared without communicating with a coach in advance.",
    "<strong>Possession or use of alcohol, tobacco/vaping products, or drugs at any team event.</strong>"
  ], twoCol: true }
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Discipline &amp; Suspensions — Minor &amp; Serious", body: [
  { p: "Coaches always retain discretion to escalate based on severity. This isn't limited to team events — an issue at school or at home becomes an issue with this team too." },
  { h: "Minor offenses", note: "disrespectful remarks, arguing with an official, not following equipment/uniform rules, locker room disruption, no-show without any notice", ol: [
    "First time: warning from a coach, conversation with the player.",
    "Second time: expect to sit out."
  ]},
  { h: "Serious offenses", note: "fighting or instigating, abusive language/gestures, deliberate attempt to injure, hazing/bullying, unauthorized recording in the locker room", ul: [
    "Minimum 1–2 game suspension, at the coaching staff's discretion.",
    "A repeat serious offense adds additional games or removal from the team."
  ]}
]},

{ type: "content", section: "Part 1 &middot; Team Rules", title: "Discipline &amp; Suspensions — Zero Tolerance", body: [
  { h: "Zero-tolerance offenses", note: "physical violence beyond the play of the game, harassment or discrimination, alcohol/drug/vape possession or use at a team event, hazing that causes harm", ul: [
    "Immediate removal from the team event (practice, game, or otherwise).",
    "Multi-game suspension up to removal from the team for the season, at the coaching staff's and club leadership's discretion.",
    "Handled per USA Hockey SafeSport policy where applicable."
  ]}
]},

{ type: "divider", section: "Part 2", title: "Logistics" },

{ type: "content", section: "Part 2 &middot; Logistics", title: "Before Games", body: [
  { ul: [
    "<strong>Arrive no later than 45 minutes before game time.</strong>",
    "<strong>Off-ice warmup starts 40 minutes before game time — led by the captains.</strong> It must be organized and planned — captains own this; if it isn't working, we'll provide a plan to execute. Everyone participates (goalies are the only exception, if they have their own routine).",
    "Bring both uniforms to every game. Captains/players confirm with the opposing team's coaches which jersey we're wearing and communicate that to the team before warmups.",
    "Be <strong>fully dressed before the Zamboni is on the ice.</strong> By 10 minutes before game time, give full attention as coaches talk through the game plan — focus areas, how we can win, expectations."
  ]}
]},

{ type: "content", section: "Part 2 &middot; Logistics", title: "After Games", body: [
  { ul: [
    "When coaches enter the locker room, freeze — stop getting undressed and be ready to actively listen.",
    "Be supportive of your teammates. Not everyone makes the perfect play every time during a game — there's no calling out teammates.",
    "Discuss the game with constructive criticism, and continue to support each other.",
    "Move on: be upset if we lost, but understand it and learn from it. Be excited about a win, but stay humble — there's always room for growth."
  ]}
]},

{ type: "content", section: "Part 2 &middot; Logistics", title: "Practice", body: [
  { ul: [
    "Practice plans are posted by 2:00 PM on practice days (see Staying Informed above). Come prepared, with a general understanding of the plan for the day.",
    "Always bring effort — practice at high speed and high intensity, and challenge each other.",
    "Be present, both physically and mentally. Ask questions — this is the time to learn.",
    "Practice will be fun at times, fast at times, and slow or repetitive at times as we work through systems — understand that, and embrace it.",
    "If a coach is explaining something to one player, everyone else should be listening too — we don't want to repeat the same explanation multiple times.",
    "Help set up and transition between drills — pucks, nets, and other equipment — as we move from one drill to the next.",
    "If we're the last team on the rink for the night, bring the puck bag up to the Coaches Room — door code 1944.",
    "Same equipment standard as games: full gear including neck guards, correct jerseys and socks."
  ]}
]},

{ type: "divider", section: "Part 3 &middot; Hockey Systems &amp; Strategy", title: "Even Strength" },

{ type: "content", section: "Even Strength", title: "Forecheck", body: [
  { p: "Structure: <strong>2-1-2</strong>, tightening into something close to a <strong>2-3</strong> depending on the read." },
  { ul: [
    "<strong>F1</strong> — aggressive on the puck carrier.",
    "<strong>F2</strong> — in support.",
    "<strong>F3</strong> — stays high."
  ]}
]},

{ type: "content", section: "Even Strength", title: "Neutral Zone — Regroup / Offense", body: [
  { ul: [
    "At least 2 of our 3 forwards need to be moving — ideally all 3.",
    "Objective: collect the puck with speed — we have a better chance of transitioning successfully into the offensive zone."
  ]}
]},

{ type: "content", section: "Even Strength", title: "Neutral Zone Forecheck", body: [
  { h: "1-2-2 (Triangle)", ul: [
    "Our three forwards form a triangle: one man pressures the puck; the other two sit at the bottom of the triangle, not chasing in line with the pressuring forward.",
    "Both defensemen push up as much as possible, closing gaps.",
    "As the puck moves D-to-D or through the neutral zone, maintain the triangle shape as much as possible."
  ]}
]},

{ type: "content", section: "Even Strength", title: "Defensive Zone", body: [
  { p: "Traditional coverage:" },
  { ul: [
    "One D always fronts the net — make the opposing player uncomfortable: stick on them, body on them, move them. Don't let them claim space.",
    "The other D goes to the puck when it's in the corner on their side.",
    "Wings avoid going below the hash marks/dots — except in an emergency.",
    "Centers support the puck at all times.",
    "Wings take good lines/angles to take away the shooting lane: when the opposing point/defenseman has the puck, take away the shot first, forcing the play back down the wall or away from the net."
  ]}
]},

{ type: "divider", section: "Part 3 &middot; Hockey Systems &amp; Strategy", title: "Special Teams" },

{ type: "content", section: "Special Teams", title: "Penalty Kill — In Zone", body: [
  { p: "Basic <strong>box</strong>." },
  { ul: [
    "Passive until it's the right time to be aggressive.",
    "Keep the puck outside — force shots/plays from outside &quot;the house.&quot;",
    "Puck comes into the house &rarr; get aggressive. Puck stays outside the house &rarr; stay passive.",
    "Be aggressive to win a loose or mishandled puck and clear it.",
    "Return to passive as soon as the opponent regains full control."
  ]}
]},

{ type: "content", section: "Special Teams", title: "Penalty Kill — Forecheck", body: [
  { h: "Right Side Overload", note: "a drill in the Drill Library", ul: [
    "Alignment: a 1 and a 3, with the &quot;1&quot; slightly forward of the &quot;3,&quot; offset to the right side.",
    "Goal: take away half the ice on the opponent's breakout, forcing them up one side.",
    "The strong-side player (lined up on the red line) gets aggressive support; the other two players drop back into coverage.",
    "Avoid giving up cutbacks — force the play up one side and keep it there."
  ]}
]},

{ type: "content", section: "Special Teams", title: "Power Play — Breakout", body: [
  { ul: [
    "Three players come up the ice together; two swing through the neutral zone — timing first, speed second.",
    "Move up the ice as a unit.",
    "Try to fill four lanes as we enter the offensive zone.",
    "First priority: possess the puck into the zone.",
    "If we're met with pressure after crossing the red line and can't carry it in clean: chip and chase — not dump and chase. Put the puck to a spot with intention, where we expect to win the race to it, then regain possession and get into our zone offense."
  ]}
]},

{ type: "content", section: "Special Teams", title: "Power Play — In Zone", body: [
  { p: "Running a <strong>1-3-1</strong>." },
  { ul: [
    "Settle in — don't force it. Move the puck to whoever's open, using the bumper as an outlet.",
    "Look to create offense from below the circles.",
    "When the quarterback or the shooter is loaded up with the puck, make sure to have a net-front presence with our low player(s).",
    "When the play is with the point/passer, drop the net-front guy below the goal line for a low play: low-to-bumper, or point-to-shooter-to-backdoor to the net-front/low guy."
  ]}
]},

{ type: "divider", section: "Part 3 &middot; Hockey Systems &amp; Strategy", title: "Faceoffs" },

{ type: "content", section: "Faceoffs", title: "Defensive Zone Faceoffs — Stack &amp; Doubles", body: [
  { h: "Stack (base alignment)", ul: [
    "This is our default for every defensive-zone draw unless we call something else (like a three-across) — most of the time, we're running the stack.",
    "The wing who'd normally line up on the boards side instead lines up in the middle and comes through the faceoff.",
    "Coverage progression if we don't win clean, in order: (1) the dot/puck, (2) the shooter, (3) the defenseman on the boards side.",
    "Everyone else on the draw has an assigned man/position to cover — these assignments are not negotiable."
  ]},
  { h: "&quot;Doubles&quot; (not a separate play)", ul: [
    "Not really its own play — still our stack alignment, just with both defensemen moved to the front of the net to match a situation where the other team puts two forwards there."
  ]}
]},

{ type: "content", section: "Faceoffs", title: "Defensive Zone Faceoffs — Whiteout", body: [
  { h: "&quot;Whiteout&quot; (win play — bench call)", ul: [
    "Currently the only true faceoff <em>play</em> we run out of the defensive zone.",
    "On a clean win, puck goes back to the corner to the defenseman.",
    "The net-front wing (not the stack guy) breaks immediately, straight up ice toward the left hash marks of the center circle.",
    "The D banks a hard, indirect pass off the far-side boards, aiming just below the blue line, timed to meet the breaking forward. Well-timed, it can spring a breakaway.",
    "This is a bench call, not a player call — and it carries real risk.",
    "The D in front of the net must still cover their man, and we never force the pass through the middle unless it's completely open."
  ]}
]},

{ type: "diagram", section: "Faceoffs", title: "Offensive Zone Faceoffs — Diablo", body: [
  { p: "C wins the draw and passes to RW, who passes back to D1 for a shot from the point; LW rolls to the front of the net for a screen; C trails in behind for the tip/rebound." }
]},

{ type: "content", section: "Faceoffs", title: "Offensive Zone Faceoffs — Bender &amp; Double Supreme", body: [
  { h: "Bender", ul: [
    "Center sets up the shooter on the center's backhand side; wins the draw backhand back to the shooter, who shoots."
  ]},
  { h: "Double Supreme", ul: [
    "Stack two wings in front of the net; center takes the shot off the draw. Want the center on his forehand at the dot if possible."
  ]},
  { note: "Two more offensive-zone faceoff plays will be added to the library later this season." }
]},

{ type: "title", eyebrow: "That's the whole handbook", title: "Questions?", sub: "The full, always-current reference lives on the team site — this deck is just a way to walk through it together." }
];

(function () {
"use strict";
var HASH = "978d657be20a82b87941d32cb19f89140c2996a17c3cf5ce51843b50fa5074f2";
var STORE_KEY = "jrhc-team-presenter-unlocked";

function sha256(text) {
var enc = new TextEncoder().encode(text);
return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
return Array.from(new Uint8Array(buf)).map(function (b) {
return b.toString(16).padStart(2, "0");
}).join("");
});
}

function reveal() {
document.getElementById("gate").style.display = "none";
document.getElementById("deck-root").style.display = "";
initDeck();
}

function tryUnlock() {
var val = document.getElementById("gatePw").value;
sha256(val).then(function (digest) {
if (digest === HASH) {
try { localStorage.setItem(STORE_KEY, "1"); } catch (e) {}
reveal();
} else {
document.getElementById("gateErr").textContent = "That's not it — try again.";
}
});
}

var already = false;
try { already = localStorage.getItem(STORE_KEY) === "1"; } catch (e) {}
if (already) {
reveal();
} else {
document.getElementById("gateBtn").addEventListener("click", tryUnlock);
document.getElementById("gatePw").addEventListener("keydown", function (e) {
if (e.key === "Enter") tryUnlock();
});
}

// ---- Deck rendering + navigation ----
var current = 0;

function blockHtml(b) {
var out = "";
if (b.h) {
out += '<div class="subhead">' + b.h + '</div>';
if (b.note) out += '<p class="subnote">' + b.note + '</p>';
}
if (b.p) out += '<p class="lead">' + b.p + '</p>';
if (b.ul) {
out += '<ul class="' + (b.twoCol ? 'two-col' : '') + '">';
b.ul.forEach(function (item) { out += '<li>' + item + '</li>'; });
out += '</ul>';
}
if (b.ol) {
out += '<ol>';
b.ol.forEach(function (item) { out += '<li>' + item + '</li>'; });
out += '</ol>';
}
if (b.note && !b.h) out += '<div class="note">' + b.note + '</div>';
return out;
}

function buildSlideEl(slide, index) {
var el = document.createElement("div");
el.className = "slide slide--" + slide.type;
el.id = "slide-" + index;

if (slide.type === "title") {
el.innerHTML =
'<p class="eyebrow">' + (slide.eyebrow || "") + '</p>' +
'<h1>' + slide.title + '</h1>' +
(slide.sub ? '<p class="sub">' + slide.sub + '</p>' : '') +
'<img class="logo-watermark" src="data:image/png;base64,' + RAILERS_LOGO_B64 + '" alt="">';
return el;
}

if (slide.type === "divider") {
el.innerHTML =
'<p class="eyebrow">' + (slide.section || "") + '</p>' +
'<h1>' + slide.title + '</h1>' +
'<img class="logo-watermark" src="data:image/png;base64,' + RAILERS_LOGO_B64 + '" alt="">';
return el;
}

// content or diagram
var head = document.createElement("div");
head.className = "slide-head";
head.innerHTML =
'<p class="eyebrow">' + (slide.section || "") + '</p>' +
'<h2>' + slide.title + (slide.tag ? '<span class="tag">' + slide.tag + '</span>' : '') + '</h2>';
el.appendChild(head);

var body = document.createElement("div");
body.className = "slide-body";
(slide.body || []).forEach(function (b) { body.innerHTML += blockHtml(b); });
el.appendChild(body);

if (slide.type === "diagram") {
var wrap = document.createElement("div");
wrap.className = "diagram-embed";
var expandBtn = document.createElement("button");
expandBtn.type = "button";
expandBtn.className = "expand-btn";
expandBtn.title = "Full screen";
expandBtn.innerHTML = "&#9974;";
expandBtn.addEventListener("click", openDiagramOverlay);
wrap.appendChild(expandBtn);
var iframe = document.createElement("iframe");
iframe.setAttribute("title", "Diablo drill diagram");
iframe.src = "data:text/html;base64," + RINKBOARD_B64;
wrap.appendChild(iframe);
el.appendChild(wrap);
}

return el;
}

function initDeck() {
var slidesEl = document.getElementById("slides");
SLIDES.forEach(function (slide, i) {
slidesEl.appendChild(buildSlideEl(slide, i));
});

function decodeEntities(str) {
return String(str)
.replace(/&middot;/g, "·")
.replace(/&amp;/g, "&")
.replace(/&quot;/g, '"')
.replace(/&rarr;/g, "→");
}

var menuList = document.getElementById("menuList");
var lastSection = null;
SLIDES.forEach(function (slide, i) {
var sectionLabel = slide.type === "divider" ? slide.title : (slide.section || slide.title);
if (slide.type !== "title" && sectionLabel !== lastSection) {
var h = document.createElement("div");
h.className = "menu-section";
h.textContent = decodeEntities(sectionLabel);
menuList.appendChild(h);
lastSection = sectionLabel;
}
var btn = document.createElement("button");
btn.type = "button";
btn.className = "menu-item";
btn.dataset.index = i;
btn.textContent = decodeEntities(slide.title);
btn.addEventListener("click", function () {
goTo(i);
closeMenu();
});
menuList.appendChild(btn);
});

document.getElementById("prevBtn").addEventListener("click", function () { goTo(current - 1); });
document.getElementById("nextBtn").addEventListener("click", function () { goTo(current + 1); });
document.getElementById("menuBtn").addEventListener("click", toggleMenu);
document.getElementById("menuOverlay").addEventListener("click", function (e) {
if (e.target.id === "menuOverlay") closeMenu();
});
document.getElementById("diagramCloseBtn").addEventListener("click", closeDiagramOverlay);
document.getElementById("diagramOverlay").addEventListener("click", function (e) {
if (e.target.id === "diagramOverlay") closeDiagramOverlay();
});

document.getElementById("imageCloseBtn").addEventListener("click", closeImageOverlay);
document.getElementById("imageOverlay").addEventListener("click", function (e) {
if (e.target.id === "imageOverlay") closeImageOverlay();
});
document.addEventListener("click", function (e) {
var trigger = e.target.closest(".img-link");
if (trigger) {
e.preventDefault();
openImageOverlay(trigger.getAttribute("data-img"), trigger.textContent);
}
});

var fsBtn = document.getElementById("fullscreenBtn");
fsBtn.addEventListener("click", function () {
if (!document.fullscreenElement) {
document.documentElement.requestFullscreen().catch(function () {});
} else {
document.exitFullscreen();
}
});

document.addEventListener("keydown", function (e) {
var diagramOpen = !document.getElementById("diagramOverlay").hidden;
var imageOpen = !document.getElementById("imageOverlay").hidden;
var menuOpen = !document.getElementById("menuOverlay").hidden;
if (e.key === "Escape") {
if (imageOpen) closeImageOverlay(); else if (diagramOpen) closeDiagramOverlay(); else if (menuOpen) closeMenu(); else toggleMenu();
return;
}
if (diagramOpen || imageOpen || menuOpen) return;
if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); goTo(current + 1); }
else if (e.key === "ArrowLeft" || e.key === "Backspace" || e.key === "PageUp") { e.preventDefault(); goTo(current - 1); }
else if (e.key === "Home") { e.preventDefault(); goTo(0); }
else if (e.key === "End") { e.preventDefault(); goTo(SLIDES.length - 1); }
});

goTo(0);
}

function openDiagramOverlay() {
var overlay = document.getElementById("diagramOverlay");
var iframe = document.getElementById("diagramOverlayIframe");
iframe.src = "data:text/html;base64," + RINKBOARD_B64;
overlay.hidden = false;
}
function openImageOverlay(src, alt) {
var overlay = document.getElementById("imageOverlay");
var img = document.getElementById("imageOverlayImg");
img.src = src;
img.alt = alt || "";
overlay.hidden = false;
}
function closeImageOverlay() {
var overlay = document.getElementById("imageOverlay");
overlay.hidden = true;
document.getElementById("imageOverlayImg").src = "";
}

function closeDiagramOverlay() {
var overlay = document.getElementById("diagramOverlay");
overlay.hidden = true;
document.getElementById("diagramOverlayIframe").src = "about:blank";
}

function toggleMenu() {
var overlay = document.getElementById("menuOverlay");
if (overlay.hidden) openMenu(); else closeMenu();
}
function openMenu() {
var overlay = document.getElementById("menuOverlay");
overlay.hidden = false;
overlay.querySelectorAll(".menu-item").forEach(function (btn) {
btn.classList.toggle("current", +btn.dataset.index === current);
});
}
function closeMenu() {
document.getElementById("menuOverlay").hidden = true;
}

function goTo(index) {
if (index < 0 || index >= SLIDES.length) return;
var prevEl = document.getElementById("slide-" + current);
if (prevEl) prevEl.classList.remove("active");
current = index;
var el = document.getElementById("slide-" + current);
if (el) el.classList.add("active");
document.getElementById("counter").textContent = (current + 1) + " / " + SLIDES.length;
document.getElementById("progressFill").style.width = (((current + 1) / SLIDES.length) * 100) + "%";
document.getElementById("prevBtn").disabled = current === 0;
document.getElementById("nextBtn").disabled = current === SLIDES.length - 1;
}
})();
</script>
